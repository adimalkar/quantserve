workload:
  type: open_loop_poisson
  arrival_rates_per_second: [1.0, 2.0, 4.0]
  duration_seconds: 8.0
  warmup_requests: 2
  seed: 42

trace_distribution:
  dataset: synthetic_lengths
  prompt_length_lognormal:
    mean: 3.5
    sigma: 0.5
    min_tokens: 16
    max_tokens: 128
  decode_length_bimodal:
    mode1_tokens: 16
    mode1_weight: 0.7
    mode2_tokens: 24
    mode2_weight: 0.3
    noise_std: 2
    min_tokens: 8
    max_tokens: 32

slo_targets:
  ttft_p99_ms: 500.0
  tpot_p99_ms: 100.0
