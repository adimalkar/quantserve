workload:
  type: "open_loop_poisson"
  arrival_rates_per_second: [1.0, 4.0, 16.0, 32.0]
  duration_seconds: 2.0
  warmup_requests: 2
  seed: 42

trace_distribution:
  dataset: "sharegpt_calibrated"
  prompt_length_lognormal:
    mean: 5.0
    sigma: 0.8
    min_tokens: 16
    max_tokens: 512
  decode_length_bimodal:
    mode1_tokens: 32
    mode1_weight: 0.70
    mode2_tokens: 128
    mode2_weight: 0.30
    noise_std: 8
    min_tokens: 1
    max_tokens: 256

slo_targets:
  ttft_p99_ms: 150.0
  tpot_p99_ms: 35.0
